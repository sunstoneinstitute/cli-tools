name: Release

# A v* tag (pushed by scripts/release.py's commit) builds macOS bottles, creates
# the GitHub release with the bottles attached, and points Formula/cli-tools.rb
# in sunstoneinstitute/homebrew-tap at the tag. The formula pours the bottles
# from this repo's release and builds from the tag's source tarball elsewhere.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish (e.g. v0.1.3)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  bottle:
    name: bottle (${{ matrix.bottle_tag }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple Silicon, macOS Sequoia
            bottle_tag: arm64_sequoia
          - os: macos-26 # Apple Silicon, macOS Tahoe
            bottle_tag: arm64_tahoe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # Bottling runs the formula's real install() through `brew install
      # --build-bottle` + `brew bottle`, so the bottle matches a source install.
      - name: Render a bottle-free formula into the tap
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          # --retry covers the window where a fresh tag is not yet servable.
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/src.tgz" "$URL"
          brew tap sunstoneinstitute/tap
          URL="$URL" SHA256="$(shasum -a 256 "$RUNNER_TEMP/src.tgz" | awk '{print $1}')" \
            python3 .github/homebrew/render-formula.py .github/homebrew/cli-tools.rb.template \
            "$(brew --repo sunstoneinstitute/tap)/Formula/cli-tools.rb"

      - name: Build and bottle
        id: bottle
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          BOTTLE_TAG: ${{ matrix.bottle_tag }}
        run: |
          set -euo pipefail
          brew install --build-bottle --verbose sunstoneinstitute/tap/cli-tools
          brew test sunstoneinstitute/tap/cli-tools
          mkdir -p "$RUNNER_TEMP/bottle"
          cd "$RUNNER_TEMP/bottle"
          brew bottle --json --no-rebuild sunstoneinstitute/tap/cli-tools
          json=$(ls cli-tools--*.bottle.json)
          q() { jq -r --arg tag "$BOTTLE_TAG" ".[keys[0]].bottle.$1" "$json"; }
          # brew bottle writes local_filename (double dash), but brew requests
          # filename (single dash) from root_url when pouring.
          filename=$(q "tags[\$tag].filename")
          mv "$(q "tags[\$tag].local_filename")" "$filename"
          q cellar > "${filename}.cellar"
          echo "file=${filename}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottle-${{ matrix.bottle_tag }}
          path: |
            ${{ runner.temp }}/bottle/${{ steps.bottle.outputs.file }}
            ${{ runner.temp }}/bottle/${{ steps.bottle.outputs.file }}.cellar
          if-no-files-found: error

  github-release:
    needs: bottle
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      arm64_sequoia: ${{ steps.shas.outputs.arm64_sequoia }}
      arm64_tahoe: ${{ steps.shas.outputs.arm64_tahoe }}
      cellar: ${{ steps.shas.outputs.cellar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bottle-*
          path: dist
          merge-multiple: true

      - name: Compute shas and verify cellar agreement
        id: shas
        run: |
          set -euo pipefail
          sequoia=$(ls dist/*.arm64_sequoia.bottle.tar.gz)
          tahoe=$(ls dist/*.arm64_tahoe.bottle.tar.gz)
          # The formula states one cellar for both bottles.
          if [ "$(cat "$sequoia.cellar")" != "$(cat "$tahoe.cellar")" ]; then
            echo "::error::cellar differs: arm64_sequoia=$(cat "$sequoia.cellar") arm64_tahoe=$(cat "$tahoe.cellar")"
            exit 1
          fi
          {
            echo "arm64_sequoia=$(sha256sum "$sequoia" | awk '{print $1}')"
            echo "arm64_tahoe=$(sha256sum "$tahoe" | awk '{print $1}')"
            echo "cellar=$(cat "$sequoia.cellar")"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with bottles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CHANGELOG=$(sed -ne "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '1d;$d')
          NOTES="$CHANGELOG

          ## Installation

          \`\`\`bash
          brew install sunstoneinstitute/tap/cli-tools
          \`\`\`"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.bottle.tar.gz --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" dist/*.bottle.tar.gz
          fi

  homebrew:
    needs: github-release
    runs-on: ubuntu-26.04
    # TAP_DEPLOY_KEY is a secret of this environment, whose policy only admits v* tags.
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Render final formula
        env:
          ROOT_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}
          ARM64_SEQUOIA_SHA: ${{ needs.github-release.outputs.arm64_sequoia }}
          ARM64_TAHOE_SHA: ${{ needs.github-release.outputs.arm64_tahoe }}
          CELLAR: ${{ needs.github-release.outputs.cellar }}
        run: |
          set -euo pipefail
          export URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/src.tgz" "$URL"
          SHA256="$(sha256sum "$RUNNER_TEMP/src.tgz" | awk '{print $1}')" \
            python3 .github/homebrew/render-formula.py .github/homebrew/cli-tools.rb.template \
            "$RUNNER_TEMP/cli-tools.rb"

      - name: Push formula to the tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/tap_deploy_key"
          KNOWN_HOSTS="$RUNNER_TEMP/known_hosts"
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY_FILE"
          # Otherwise an empty or malformed secret surfaces as an opaque ssh error.
          if ! ssh-keygen -y -f "$KEY_FILE" > /dev/null 2>&1 < /dev/null; then
            echo "::error::TAP_DEPLOY_KEY is not a usable OpenSSH private key (${#TAP_DEPLOY_KEY} bytes)."
            exit 1
          fi
          # Pin GitHub's host keys from the meta API instead of trusting on first use.
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > "$KNOWN_HOSTS"
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS"

          git clone --depth 1 git@github.com:sunstoneinstitute/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          cp "$RUNNER_TEMP/cli-tools.rb" Formula/cli-tools.rb
          git add Formula/cli-tools.rb
          if git diff --cached --quiet; then
            echo "::notice::Formula already matches ${TAG}, nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update cli-tools to ${TAG}"
          git push
